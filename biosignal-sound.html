<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioSignal → Sound</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:       #060609;
  --surface:  #0b0b13;
  --panel:    #0f0f1a;
  --border:   #1c1c2e;
  --border2:  #252540;
  --text:     #b8c0d8;
  --dim:      #454870;
  --faint:    #1e2035;
  --cyan:     #00e5cc;
  --cyan-dim: #00e5cc33;
  --purple:   #9d5cff;
  --purple-dim:#9d5cff33;
  --amber:    #f0a500;
  --red:      #ff3d6e;
  --green:    #00d97e;
}

html, body {
  height: 100%; overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
}

/* ── Layout ─────────────────────────────────────────────── */
#app {
  display: grid;
  grid-template-rows: 40px 1fr;
  height: 100vh;
}

#header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 12px;
  flex-shrink: 0;
}

#main {
  display: grid;
  grid-template-columns: 320px 1fr 280px;
  gap: 1px;
  background: var(--border);
  overflow: hidden;
}

.panel {
  background: var(--panel);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.ph {
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 9px;
  letter-spacing: 2.5px;
  color: var(--dim);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.pb {
  flex: 1;
  overflow-y: auto;
}
.pb::-webkit-scrollbar { width: 3px; }
.pb::-webkit-scrollbar-thumb { background: var(--border2); }

/* ── Header ─────────────────────────────────────────────── */
.logo {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: var(--cyan);
  flex-shrink: 0;
}
.logo span { color: var(--dim); font-weight: 300; }

.hstatus {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--dim);
}
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--border2);
  flex-shrink: 0;
  transition: background 0.3s, box-shadow 0.3s;
}
.dot.on  { background: var(--green);  box-shadow: 0 0 8px var(--green); }
.dot.warn{ background: var(--amber);  box-shadow: 0 0 8px var(--amber); }
.dot.err { background: var(--red);    box-shadow: 0 0 8px var(--red); }

.hsep { flex: 1; }

.btn {
  background: var(--faint);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 4px 11px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 1.5px;
  cursor: pointer;
  text-transform: uppercase;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--cyan); color: var(--cyan); }
.btn.on { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }
.btn.purple.on { border-color: var(--purple); color: var(--purple); background: var(--purple-dim); }
.btn:disabled { opacity: 0.3; cursor: default; }

/* ── Source tabs ─────────────────────────────────────────── */
.src-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.src-tab {
  flex: 1;
  padding: 5px 0;
  text-align: center;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--dim);
  border-right: 1px solid var(--border);
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
}
.src-tab:last-child { border-right: none; }
.src-tab.active { color: var(--cyan); background: var(--cyan-dim); }
.src-tab.future {
  color: var(--border2);
  cursor: default;
  font-style: italic;
  position: relative;
}
.src-tab.future::after {
  content: attr(data-soon);
  position: absolute;
  bottom: 100%; left: 50%;
  transform: translateX(-50%);
  background: var(--panel);
  border: 1px solid var(--border2);
  padding: 2px 6px;
  font-size: 8px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
}
.src-tab.future:hover::after { opacity: 1; }

/* ── Camera ──────────────────────────────────────────────── */
#video-wrap {
  position: relative;
  background: #020204;
  aspect-ratio: 4/3;
  flex-shrink: 0;
  overflow: hidden;
}
#video {
  width: 100%; height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
  opacity: 0;
  transition: opacity 0.4s;
}
#video.ready { opacity: 0.8; }
#overlay {
  position: absolute; inset: 0;
  transform: scaleX(-1);
}
#cam-placeholder {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px; color: var(--border2);
  font-size: 10px; letter-spacing: 1px;
}
#cam-placeholder svg { width: 32px; height: 32px; opacity: 0.3; }

/* ── Signal list ─────────────────────────────────────────── */
.sig-group {
  font-size: 8px; letter-spacing: 2px;
  color: var(--border2);
  padding: 8px 10px 3px;
  text-transform: uppercase;
  border-top: 1px solid var(--border);
  margin-top: 2px;
}
.sig-group:first-child { border-top: none; margin-top: 0; }

.sig-row {
  display: grid;
  grid-template-columns: 1fr 42px 90px;
  gap: 5px;
  align-items: center;
  padding: 3px 10px;
  cursor: pointer;
  border-radius: 2px;
  transition: background 0.1s;
}
.sig-row:hover { background: var(--faint); }
.sig-row:active { background: var(--cyan-dim); }

.sig-name {
  color: var(--dim);
  font-size: 9.5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sig-val {
  color: var(--cyan);
  font-size: 9.5px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.sig-bar {
  height: 3px;
  background: var(--faint);
  border-radius: 2px;
  overflow: hidden;
}
.sig-bar-fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, #0055cc, var(--cyan));
  transition: width 40ms linear;
}

/* ── Mapper ──────────────────────────────────────────────── */
.mapper-thead {
  display: grid;
  grid-template-columns: 130px 1fr 58px 58px 70px 26px;
  gap: 4px;
  padding: 5px 10px;
  border-bottom: 1px solid var(--border);
  font-size: 8px;
  letter-spacing: 1.5px;
  color: var(--border2);
  text-transform: uppercase;
  flex-shrink: 0;
}

#mapper-rows { flex: 1; overflow-y: auto; }
#mapper-rows::-webkit-scrollbar { width: 3px; }
#mapper-rows::-webkit-scrollbar-thumb { background: var(--border2); }

.map-row-wrap { border-bottom: 1px solid var(--border); }
.map-row {
  display: grid;
  grid-template-columns: 130px 1fr 58px 58px 70px 26px;
  gap: 4px;
  align-items: center;
  padding: 5px 10px;
  transition: background 0.1s;
}
.map-row:hover { background: var(--faint); }

.map-bar {
  height: 2px;
  background: var(--faint);
  margin: 0 10px 4px;
  border-radius: 1px;
  overflow: hidden;
}
.map-bar-fill {
  height: 100%;
  background: var(--purple);
  border-radius: 1px;
  transition: width 40ms linear;
}

select, input[type="number"] {
  background: var(--faint);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 3px 4px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  width: 100%;
}
select { cursor: pointer; }
select:focus, input:focus { outline: none; border-color: var(--purple); }
option { background: var(--panel); }

.rm-btn {
  background: none;
  border: 1px solid transparent;
  color: var(--border2);
  cursor: pointer;
  font-size: 12px;
  line-height: 1;
  padding: 1px 4px;
  transition: color 0.15s, border-color 0.15s;
}
.rm-btn:hover { color: var(--red); border-color: var(--red); }

.mapper-footer {
  padding: 8px 10px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

/* ── Audio panel ─────────────────────────────────────────── */
#viz-canvas {
  width: 100%;
  height: 72px;
  background: #020204;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  display: block;
}

.audio-section {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
}
.audio-section-label {
  font-size: 8px;
  letter-spacing: 2px;
  color: var(--border2);
  text-transform: uppercase;
  margin-bottom: 6px;
}

.wave-btns {
  display: flex; gap: 3px;
}
.wave-btn {
  flex: 1;
  padding: 3px 0;
  font-size: 8px;
  letter-spacing: 1px;
  text-align: center;
  cursor: pointer;
  background: var(--faint);
  border: 1px solid var(--border);
  color: var(--dim);
  transition: all 0.1s;
  font-family: 'IBM Plex Mono', monospace;
}
.wave-btn:hover { border-color: var(--amber); color: var(--amber); }
.wave-btn.on { border-color: var(--amber); color: var(--amber); background: #f0a50022; }

.ctrl-row {
  display: grid;
  grid-template-columns: 76px 1fr 40px;
  gap: 6px;
  align-items: center;
  padding: 2px 0;
}
.ctrl-lbl { font-size: 9px; color: var(--dim); }
.ctrl-val {
  font-size: 9px;
  color: var(--purple);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

input[type="range"] {
  -webkit-appearance: none;
  height: 2px;
  background: var(--border2);
  border: none;
  padding: 0;
  cursor: pointer;
  width: 100%;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--purple);
  cursor: pointer;
  transition: transform 0.1s;
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); }

/* ── Clipboard toast ─────────────────────────────────────── */
#toast {
  position: fixed;
  bottom: 16px; left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--surface);
  border: 1px solid var(--cyan);
  color: var(--cyan);
  padding: 5px 14px;
  font-size: 10px;
  letter-spacing: 1px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 999;
}
#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Misc ────────────────────────────────────────────────── */
.note-badge {
  font-size: 8px; color: var(--amber); margin-left: auto;
  font-variant-numeric: tabular-nums;
}
</style>
</head>
<body>
<div id="app">
  <!-- ── Header ──────────────────────────────────────────── -->
  <header id="header">
    <div class="logo">BIO<span>SIGNAL</span> → SOUND</div>
    <div class="hstatus">
      <div class="dot" id="cv-dot"></div>
      <span id="status-lbl">READY</span>
    </div>
    <div class="hsep"></div>
    <button class="btn" id="cv-btn">START CAMERA</button>
    <button class="btn purple" id="audio-btn">AUDIO OFF</button>
  </header>

  <!-- ── Main ───────────────────────────────────────────── -->
  <div id="main">

    <!-- LEFT: Input source + Signals -->
    <div class="panel" style="display:grid;grid-template-rows:auto auto 1fr;">
      <div class="src-tabs">
        <div class="src-tab active">CV</div>
        <div class="src-tab future" data-soon="Coming: EEG via Web Serial">EEG</div>
        <div class="src-tab future" data-soon="Coming: EMG sensor input">EMG</div>
        <div class="src-tab future" data-soon="Coming: EKG / heart rate">EKG</div>
      </div>

      <div id="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="cam-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>
          </svg>
          <span>START CAMERA</span>
        </div>
      </div>

      <div class="panel" style="border-top:1px solid var(--border);">
        <div class="ph">
          SIGNALS
          <span style="margin-left:auto;font-size:8px;color:var(--border2);">CLICK TO COPY KEY</span>
        </div>
        <div class="pb" id="sig-list">
          <div style="padding:20px 10px;color:var(--border2);font-size:10px;text-align:center;">
            Start camera to see signals
          </div>
        </div>
      </div>
    </div>

    <!-- MIDDLE: Mapper -->
    <div class="panel" style="display:grid;grid-template-rows:auto auto 1fr auto;">
      <div class="ph">SIGNAL → AUDIO MAPPER</div>
      <div class="mapper-thead">
        <span>AUDIO PARAM</span>
        <span>SIGNAL</span>
        <span>OUT MIN</span>
        <span>OUT MAX</span>
        <span>CURVE</span>
        <span></span>
      </div>
      <div id="mapper-rows"></div>
      <div class="mapper-footer">
        <button class="btn" id="add-map-btn" style="flex:1">+ ADD MAPPING</button>
        <button class="btn" id="preset-btn">PRESET</button>
      </div>
    </div>

    <!-- RIGHT: Audio engine -->
    <div class="panel">
      <div class="ph">AUDIO ENGINE</div>
      <canvas id="viz-canvas"></canvas>
      <div class="pb" id="audio-panel">
        <div style="padding:16px 10px;color:var(--border2);font-size:10px;text-align:center;">
          Enable audio to begin
        </div>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script type="module">
// ═══════════════════════════════════════════════════════════════════════
//  SIGNAL BUS
//  Central registry for all biosignal sources.
//  To add a new source: call bus.register() for each signal in your
//  source's init(), then call bus.update(key, value) each sample.
// ═══════════════════════════════════════════════════════════════════════
const bus = (() => {
  const signals = new Map(); // key → {value, min, max, label, group, source}

  return {
    signals,
    register(key, meta) {
      signals.set(key, { value: meta.min ?? 0, min: 0, max: 1, ...meta });
    },
    update(key, value) {
      const s = signals.get(key);
      if (!s) return;
      const v = isNaN(value) ? s.min : Math.max(s.min, Math.min(s.max, value));
      s.value = v;
    },
    norm(key) {
      const s = signals.get(key);
      if (!s || s.max === s.min) return 0;
      return (s.value - s.min) / (s.max - s.min);
    },
    decay(key, factor = 0.88) {
      const s = signals.get(key);
      if (s) s.value *= factor;
    }
  };
})();


// ═══════════════════════════════════════════════════════════════════════
//  MATH HELPERS
// ═══════════════════════════════════════════════════════════════════════
const dist3 = (a, b) => {
  const dx = a.x-b.x, dy = a.y-b.y, dz = (a.z||0)-(b.z||0);
  return Math.sqrt(dx*dx + dy*dy + dz*dz);
};

const angleBetween = (a, b, c) => {
  // angle at joint b, using vectors ba and bc
  const ba = [a.x-b.x, a.y-b.y, (a.z||0)-(b.z||0)];
  const bc = [c.x-b.x, c.y-b.y, (c.z||0)-(b.z||0)];
  const dot = ba[0]*bc[0] + ba[1]*bc[1] + ba[2]*bc[2];
  const mag = Math.sqrt(ba[0]**2+ba[1]**2+ba[2]**2) * Math.sqrt(bc[0]**2+bc[1]**2+bc[2]**2);
  return mag < 1e-6 ? 0 : Math.acos(Math.min(1, Math.max(-1, dot/mag))) * (180/Math.PI);
};

const handOpenness = (lm) => {
  const handSize = dist3(lm[0], lm[9]);
  if (handSize < 1e-4) return 0;
  const tips = [4, 8, 12, 16, 20];
  const avg = tips.reduce((s, i) => s + dist3(lm[0], lm[i]), 0) / tips.length;
  return Math.min(1, avg / (handSize * 2.2));
};

const fingerExt = (lm, f) => {
  const bases = [2, 5, 9, 13, 17];
  const tips  = [4, 8, 12, 16, 20];
  const norm  = dist3(lm[0], lm[9]);
  return norm < 1e-4 ? 0 : Math.min(1, dist3(lm[bases[f]], lm[tips[f]]) / (norm * 1.5));
};


// ═══════════════════════════════════════════════════════════════════════
//  CV SOURCE  (MediaPipe Hand + Pose)
// ═══════════════════════════════════════════════════════════════════════
const cvSource = {
  hand: null,
  pose: null,
  video: null,
  canvas: null,
  ctx: null,
  running: false,
  lastTime: -1,

  // ── Register all CV signals into the bus ──────────────────────────
  registerSignals() {
    ['L','R'].forEach(s => {
      const lbl = s === 'L' ? 'Left' : 'Right';
      const g = `hand ${s.toLowerCase()}`;
      bus.register(`hand_${s}_x`,    { label:`${lbl} Wrist X`,    group:g, min:0, max:1, source:'cv' });
      bus.register(`hand_${s}_y`,    { label:`${lbl} Wrist Y`,    group:g, min:0, max:1, source:'cv' });
      bus.register(`hand_${s}_open`, { label:`${lbl} Openness`,   group:g, min:0, max:1, source:'cv' });
      bus.register(`hand_${s}_spread`,{ label:`${lbl} Spread`,    group:g, min:0, max:1, source:'cv' });
      const fnames = ['Thumb','Index','Middle','Ring','Pinky'];
      fnames.forEach((fn, fi) =>
        bus.register(`finger_${s}_${fn.toLowerCase()}`, {
          label:`${lbl} ${fn}`, group:g, min:0, max:1, source:'cv'
        })
      );
    });

    const g2 = 'pose';
    bus.register('elbow_L',        { label:'L Elbow Angle',    group:g2, min:0,   max:180, source:'cv' });
    bus.register('elbow_R',        { label:'R Elbow Angle',    group:g2, min:0,   max:180, source:'cv' });
    bus.register('shoulder_y_L',   { label:'L Shoulder Height',group:g2, min:0,   max:1,   source:'cv' });
    bus.register('shoulder_y_R',   { label:'R Shoulder Height',group:g2, min:0,   max:1,   source:'cv' });
    bus.register('shoulder_width', { label:'Shoulder Width',   group:g2, min:0,   max:1,   source:'cv' });
    bus.register('arm_raise_L',    { label:'L Arm Raise',      group:g2, min:0,   max:1,   source:'cv' });
    bus.register('arm_raise_R',    { label:'R Arm Raise',      group:g2, min:0,   max:1,   source:'cv' });
    bus.register('torso_tilt',     { label:'Torso Tilt',       group:g2, min:-1,  max:1,   source:'cv' });
    bus.register('head_x',         { label:'Head X',           group:g2, min:0,   max:1,   source:'cv' });
    bus.register('head_y',         { label:'Head Y',           group:g2, min:0,   max:1,   source:'cv' });
    bus.register('nose_y',         { label:'Nose Dip',         group:g2, min:0,   max:1,   source:'cv' });
  },

  // ── Load MediaPipe models ─────────────────────────────────────────
  async init() {
    this.registerSignals();
    setStatus('loading', 'LOADING MODELS…');

    const { FilesetResolver, HandLandmarker, PoseLandmarker } = await import(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs'
    );

    const vision = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );

    this.hand = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        delegate: 'GPU'
      },
      numHands: 2,
      runningMode: 'VIDEO'
    });

    this.pose = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      numPoses: 1
    });
  },

  // ── Camera startup ────────────────────────────────────────────────
  async startCamera() {
    this.video  = document.getElementById('video');
    this.canvas = document.getElementById('overlay');
    this.ctx    = this.canvas.getContext('2d');

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: 'user' }
    });
    this.video.srcObject = stream;
    await new Promise(r => this.video.onloadedmetadata = r);

    const wrap = this.video.parentElement;
    this.canvas.width  = wrap.offsetWidth;
    this.canvas.height = wrap.offsetHeight;

    document.getElementById('cam-placeholder').style.display = 'none';
    this.video.classList.add('ready');
    this.running = true;
    this.loop();
  },

  // ── Detection loop ────────────────────────────────────────────────
  loop() {
    if (!this.running) return;
    const now = performance.now();
    if (this.video.currentTime !== this.lastTime) {
      this.lastTime = this.video.currentTime;
      try {
        const hr = this.hand.detectForVideo(this.video, now);
        const pr = this.pose.detectForVideo(this.video, now);
        this.processHands(hr);
        this.processPose(pr);
        this.drawOverlay(hr, pr);
      } catch(e) {}
    }
    requestAnimationFrame(() => this.loop());
  },

  // ── Signal extraction: hands ──────────────────────────────────────
  processHands(r) {
    const found = { L: null, R: null };
    if (r.handednesses && r.landmarks) {
      r.handednesses.forEach((h, i) => {
        // MediaPipe Tasks API reports handedness from the subject's perspective
        const side = h[0].categoryName === 'Left' ? 'L' : 'R';
        found[side] = r.landmarks[i];
      });
    }

    ['L','R'].forEach(s => {
      const lm = found[s];
      if (lm) {
        bus.update(`hand_${s}_x`,     lm[0].x);
        bus.update(`hand_${s}_y`,     1 - lm[0].y); // flip: up = 1
        bus.update(`hand_${s}_open`,  handOpenness(lm));
        bus.update(`hand_${s}_spread`,Math.min(1, dist3(lm[4], lm[20]) / (dist3(lm[0], lm[9]) * 2.5)));
        ['thumb','index','middle','ring','pinky'].forEach((n,fi) =>
          bus.update(`finger_${s}_${n}`, fingerExt(lm, fi))
        );
      } else {
        // Smooth decay to zero when hand leaves frame
        [`hand_${s}_x`,`hand_${s}_y`,`hand_${s}_open`,`hand_${s}_spread`].forEach(k => bus.decay(k));
        ['thumb','index','middle','ring','pinky'].forEach(n => bus.decay(`finger_${s}_${n}`));
      }
    });
  },

  // ── Signal extraction: pose ───────────────────────────────────────
  processPose(r) {
    if (!r.landmarks?.length) return;
    const lm = r.landmarks[0];
    // Landmark indices: 0=nose, 11=Lshoulder, 12=Rshoulder, 13=Lelbow,
    //   14=Relbow, 15=Lwrist, 16=Rwrist, 23=Lhip, 24=Rhip
    const [ls,rs,le,re,lw,rw,lh,rh,nose] = [11,12,13,14,15,16,23,24,0].map(i=>lm[i]);

    if (ls && le && lw) {
      bus.update('elbow_L',     angleBetween(ls, le, lw));
      bus.update('arm_raise_L', Math.max(0, 1 - ls.y));
    }
    if (rs && re && rw) {
      bus.update('elbow_R',     angleBetween(rs, re, rw));
      bus.update('arm_raise_R', Math.max(0, 1 - rs.y));
    }
    if (ls && rs) {
      bus.update('shoulder_y_L', 1 - ls.y);
      bus.update('shoulder_y_R', 1 - rs.y);
      bus.update('shoulder_width', Math.abs(ls.x - rs.x));
    }
    if (ls && rs && lh && rh) {
      const smx = (ls.x+rs.x)/2, hmx = (lh.x+rh.x)/2;
      bus.update('torso_tilt', Math.max(-1, Math.min(1, (smx-hmx)*5)));
    }
    if (nose) {
      bus.update('head_x',  nose.x);
      bus.update('head_y',  1 - nose.y);
      bus.update('nose_y',  nose.y); // raw: high = head down
    }
  },

  // ── Canvas skeleton overlay ───────────────────────────────────────
  drawOverlay(hr, pr) {
    const { ctx, canvas: c } = this;
    ctx.clearRect(0, 0, c.width, c.height);

    // Replicate the object-fit:cover scale/offset so skeleton aligns with the
    // displayed video regardless of camera resolution vs. container aspect ratio.
    const vw = this.video.videoWidth, vh = this.video.videoHeight;
    const scale = Math.max(c.width / vw, c.height / vh);
    const ox = (c.width  - vw * scale) / 2;
    const oy = (c.height - vh * scale) / 2;
    const lx = x => ox + x * vw * scale;
    const ly = y => oy + y * vh * scale;

    // Hands
    if (hr.landmarks) {
      const CONNS = [
        [0,1],[1,2],[2,3],[3,4],
        [0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12],
        [0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20],
        [5,9],[9,13],[13,17]
      ];
      hr.landmarks.forEach((lm, hi) => {
        const isRight = hr.handednesses[hi]?.[0]?.categoryName === 'Right';
        const col = isRight ? '#00e5cc' : '#9d5cff';
        ctx.strokeStyle = col + 'aa'; ctx.lineWidth = 1.5;
        CONNS.forEach(([a,b]) => {
          ctx.beginPath();
          ctx.moveTo(lx(lm[a].x), ly(lm[a].y));
          ctx.lineTo(lx(lm[b].x), ly(lm[b].y));
          ctx.stroke();
        });
        lm.forEach((pt, i) => {
          ctx.fillStyle = i === 0 ? '#fff' : col;
          ctx.beginPath();
          ctx.arc(lx(pt.x), ly(pt.y), i===0?3:2, 0, Math.PI*2);
          ctx.fill();
        });
      });
    }

    // Pose skeleton
    if (pr.landmarks?.length) {
      const lm = pr.landmarks[0];
      const PC = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24]];
      ctx.strokeStyle = '#f0a50066'; ctx.lineWidth = 2;
      PC.forEach(([a,b]) => {
        if (!lm[a]||!lm[b]) return;
        ctx.beginPath();
        ctx.moveTo(lx(lm[a].x), ly(lm[a].y));
        ctx.lineTo(lx(lm[b].x), ly(lm[b].y));
        ctx.stroke();
      });
      [11,12,13,14,15,16].forEach(i => {
        if (!lm[i]) return;
        ctx.fillStyle = '#f0a500';
        ctx.beginPath();
        ctx.arc(lx(lm[i].x), ly(lm[i].y), 3, 0, Math.PI*2);
        ctx.fill();
      });
    }
  }
};


// ═══════════════════════════════════════════════════════════════════════
//  AUDIO ENGINE  (Web Audio API)
// ═══════════════════════════════════════════════════════════════════════
const engine = (() => {
  let ctx, analyser, osc1, osc2, osc1g, osc2g, filt, lfo, lfog, revb, revgain, drygain, mastg;
  let started = false;

  // Audio parameter definitions — name, display label, min, max, default value
  const PARAMS = {
    osc1_freq:     { label:'Osc1 Freq',     min:40,   max:2000, val:220,  unit:'Hz' },
    osc1_detune:   { label:'Osc1 Detune',   min:-100, max:100,  val:0,    unit:'¢' },
    osc2_freq:     { label:'Osc2 Freq',     min:40,   max:2000, val:330,  unit:'Hz' },
    osc2_detune:   { label:'Osc2 Detune',   min:-100, max:100,  val:0,    unit:'¢' },
    osc_mix:       { label:'Osc Mix 1↔2',  min:0,    max:1,    val:0.0  },
    filter_freq:   { label:'Filter Cutoff', min:80,   max:16000,val:3000, unit:'Hz' },
    filter_q:      { label:'Filter Q',      min:0.1,  max:18,   val:1    },
    lfo_rate:      { label:'LFO Rate',      min:0.05, max:20,   val:1,    unit:'Hz' },
    lfo_depth:     { label:'LFO Depth',     min:0,    max:1,    val:0    },
    reverb_mix:    { label:'Reverb Mix',    min:0,    max:1,    val:0.12 },
    volume:        { label:'Master Vol',    min:0,    max:1,    val:0.55 },
  };

  const makeImpulse = (ctx) => {
    const len = ctx.sampleRate * 1.8;
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++)
        d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2.5);
    }
    return buf;
  };

  async function start() {
    ctx     = new AudioContext();
    analyser= ctx.createAnalyser(); analyser.fftSize = 1024;

    osc1 = ctx.createOscillator(); osc1.type = 'sine';
    osc2 = ctx.createOscillator(); osc2.type = 'triangle';
    osc1g= ctx.createGain(); osc1g.gain.value = 1;
    osc2g= ctx.createGain(); osc2g.gain.value = 0;
    filt = ctx.createBiquadFilter(); filt.type = 'lowpass';
    lfo  = ctx.createOscillator(); lfo.type = 'sine';
    lfog = ctx.createGain(); lfog.gain.value = 0;
    revb = ctx.createConvolver(); revb.buffer = makeImpulse(ctx);
    revgain = ctx.createGain(); revgain.gain.value = PARAMS.reverb_mix.val;
    drygain = ctx.createGain(); drygain.gain.value = 1 - PARAMS.reverb_mix.val;
    mastg   = ctx.createGain(); mastg.gain.value = PARAMS.volume.val;

    // Apply stored param values
    osc1.frequency.value  = PARAMS.osc1_freq.val;
    osc1.detune.value     = PARAMS.osc1_detune.val;
    osc2.frequency.value  = PARAMS.osc2_freq.val;
    osc2.detune.value     = PARAMS.osc2_detune.val;
    filt.frequency.value  = PARAMS.filter_freq.val;
    filt.Q.value          = PARAMS.filter_q.val;
    lfo.frequency.value   = PARAMS.lfo_rate.val;

    // Graph: oscs → filter → [dry + reverb] → master → analyser → out
    osc1.connect(osc1g); osc2.connect(osc2g);
    osc1g.connect(filt); osc2g.connect(filt);
    filt.connect(drygain); filt.connect(revb);
    revb.connect(revgain);
    drygain.connect(mastg); revgain.connect(mastg);
    mastg.connect(analyser); analyser.connect(ctx.destination);

    // LFO → filter cutoff (default target)
    lfo.connect(lfog); lfog.connect(filt.frequency);

    osc1.start(); osc2.start(); lfo.start();
    started = true;
  }

  function set(key, raw) {
    const p = PARAMS[key];
    if (!p) return;
    p.val = Math.max(p.min, Math.min(p.max, raw));
    if (!started) return;
    const t = ctx.currentTime, sm = 0.025; // 25ms smoothing
    switch (key) {
      case 'osc1_freq':   osc1.frequency.linearRampToValueAtTime(p.val, t+sm); break;
      case 'osc1_detune': osc1.detune.linearRampToValueAtTime(p.val, t+sm); break;
      case 'osc2_freq':   osc2.frequency.linearRampToValueAtTime(p.val, t+sm); break;
      case 'osc2_detune': osc2.detune.linearRampToValueAtTime(p.val, t+sm); break;
      case 'osc_mix':
        osc1g.gain.linearRampToValueAtTime(1 - p.val, t+sm);
        osc2g.gain.linearRampToValueAtTime(p.val, t+sm);
        break;
      case 'filter_freq': filt.frequency.linearRampToValueAtTime(p.val, t+sm); break;
      case 'filter_q':    filt.Q.linearRampToValueAtTime(p.val, t+sm); break;
      case 'lfo_rate':    lfo.frequency.linearRampToValueAtTime(p.val, t+sm); break;
      case 'lfo_depth':   lfog.gain.linearRampToValueAtTime(p.val * 800, t+sm); break;
      case 'reverb_mix':
        revgain.gain.linearRampToValueAtTime(p.val, t+sm);
        drygain.gain.linearRampToValueAtTime(1-p.val, t+sm);
        break;
      case 'volume':      mastg.gain.linearRampToValueAtTime(p.val, t+sm); break;
    }
  }

  function setOsc1Type(t) { if (osc1) osc1.type = t; }
  function setOsc2Type(t) { if (osc2) osc2.type = t; }
  function setFilterType(t) { if (filt) filt.type = t; }

  function getWaveform() {
    if (!analyser) return null;
    const buf = new Float32Array(analyser.frequencyBinCount);
    analyser.getFloatTimeDomainData(buf);
    return buf;
  }

  function stop() { ctx?.close(); started = false; }

  return { start, set, stop, setOsc1Type, setOsc2Type, setFilterType, getWaveform, PARAMS, get started() { return started; } };
})();


// ═══════════════════════════════════════════════════════════════════════
//  MAPPER  —  Signal bus → Audio engine
// ═══════════════════════════════════════════════════════════════════════
const mapper = (() => {
  let mappings = [];
  let nextId = 0;

  const curves = {
    linear: t => t,
    quad:   t => t*t,
    cubic:  t => t*t*t,
    log:    t => Math.log(1 + t*9) / Math.log(10),
    sqrt:   t => Math.sqrt(t),
    inv:    t => 1 - t,
  };

  return {
    mappings,

    add(audioParam, signal='', outMin=null, outMax=null, curve='linear') {
      const p = engine.PARAMS[audioParam];
      const id = nextId++;
      mappings.push({
        id,
        audioParam: audioParam || Object.keys(engine.PARAMS)[0],
        signal,
        outMin: outMin ?? (p?.min ?? 0),
        outMax: outMax ?? (p?.max ?? 1),
        curve: curve || 'linear'
      });
      return id;
    },

    remove(id) {
      const i = mappings.findIndex(m => m.id === id);
      if (i >= 0) mappings.splice(i, 1);
    },

    tick() {
      mappings.forEach(m => {
        if (!m.signal) return;
        const t = curves[m.curve]?.(bus.norm(m.signal)) ?? bus.norm(m.signal);
        engine.set(m.audioParam, m.outMin + t * (m.outMax - m.outMin));
      });
    },

    applyPreset() {
      mappings.length = 0;
      nextId = 0;
      // Default musical preset
      this.add('osc1_freq',   'hand_L_y',   80,   880,  'quad');
      this.add('osc2_freq',   'hand_R_y',   80,  1320,  'quad');
      this.add('filter_freq', 'hand_L_open', 300, 8000, 'quad');
      this.add('osc_mix',     'hand_R_open',  0,     1, 'linear');
      this.add('lfo_depth',   'elbow_L',      0,     1, 'linear');
      this.add('volume',      'shoulder_y_L', 0,   0.9, 'linear');
    }
  };
})();


// ═══════════════════════════════════════════════════════════════════════
//  UI

// ── Status bar ───────────────────────────────────────────────────────
function setStatus(state, text) {
  const dot = document.getElementById('cv-dot');
  const lbl = document.getElementById('status-lbl');
  dot.className = `dot ${state === 'active' ? 'on' : state === 'loading' ? 'warn' : state === 'error' ? 'err' : ''}`;
  lbl.textContent = text;
}

// ── Clipboard toast ───────────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1400);
}

// ── Signal panel ──────────────────────────────────────────────────────
let sigPanelBuilt = false;

function buildSigPanel() {
  const list = document.getElementById('sig-list');
  const groups = new Map();
  bus.signals.forEach((s, k) => {
    const g = s.group || 'misc';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push({ k, s });
  });

  let html = '';
  groups.forEach((sigs, g) => {
    html += `<div class="sig-group">${g}</div>`;
    sigs.forEach(({ k, s }) => {
      html += `<div class="sig-row" data-key="${k}" title="Click to copy signal key">
        <span class="sig-name">${s.label}</span>
        <span class="sig-val" id="sv-${k}">0.00</span>
        <div class="sig-bar"><div class="sig-bar-fill" id="sb-${k}" style="width:0%"></div></div>
      </div>`;
    });
  });
  list.innerHTML = html;

  // Click to copy
  list.querySelectorAll('.sig-row').forEach(row => {
    row.addEventListener('click', () => {
      const key = row.dataset.key;
      navigator.clipboard.writeText(key).catch(() => {});
      toast(`Copied: ${key}`);
    });
  });

  sigPanelBuilt = true;
}

function updateSigPanel() {
  if (!sigPanelBuilt) return;
  bus.signals.forEach((s, k) => {
    const n = bus.norm(k);
    const valEl = document.getElementById(`sv-${k}`);
    const barEl = document.getElementById(`sb-${k}`);
    if (valEl) {
      const disp = s.max > 10 ? s.value.toFixed(0) : s.value.toFixed(2);
      if (valEl.textContent !== disp) valEl.textContent = disp;
    }
    if (barEl) barEl.style.width = (n * 100).toFixed(1) + '%';
  });
}

// ── Mapper UI ─────────────────────────────────────────────────────────
const SIG_OPTS = () => {
  let o = `<option value="">— none —</option>`;
  const groups = new Map();
  bus.signals.forEach((s,k) => {
    const g = s.group || 'misc';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push({ k, s });
  });
  groups.forEach((sigs, g) => {
    o += `<optgroup label="${g}">`;
    sigs.forEach(({ k, s }) => o += `<option value="${k}">${s.label}</option>`);
    o += `</optgroup>`;
  });
  return o;
};

const AP_OPTS = Object.entries(engine.PARAMS)
  .map(([k,p]) => `<option value="${k}">${p.label}</option>`).join('');

const CURVE_OPTS = [
  ['linear','Linear'],['quad','Quadratic'],['cubic','Cubic'],
  ['log','Logarithmic'],['sqrt','Square Root'],['inv','Invert']
].map(([v,l]) => `<option value="${v}">${l}</option>`).join('');

function renderMapper() {
  const rows = document.getElementById('mapper-rows');
  const sigOpts = SIG_OPTS();

  rows.innerHTML = mapper.mappings.map(m => {
    const p = engine.PARAMS[m.audioParam];
    return `<div class="map-row-wrap" data-mid="${m.id}">
      <div class="map-row">
        <select class="m-ap" data-mid="${m.id}">
          ${AP_OPTS.replace(`value="${m.audioParam}"`, `value="${m.audioParam}" selected`)}
        </select>
        <select class="m-sig" data-mid="${m.id}">
          ${sigOpts.replace(`value="${m.signal}"`, `value="${m.signal}" selected`)}
        </select>
        <input type="number" class="m-min" data-mid="${m.id}" value="${m.outMin}" step="any">
        <input type="number" class="m-max" data-mid="${m.id}" value="${m.outMax}" step="any">
        <select class="m-curve" data-mid="${m.id}">
          ${CURVE_OPTS.replace(`value="${m.curve}"`, `value="${m.curve}" selected`)}
        </select>
        <button class="rm-btn" data-mid="${m.id}">×</button>
      </div>
      <div class="map-bar"><div class="map-bar-fill" id="mb-${m.id}" style="width:0%"></div></div>
    </div>`;
  }).join('');

  // ── Events ───────────────────────────────────────────────────────
  rows.querySelectorAll('.m-ap').forEach(el => el.addEventListener('change', e => {
    const m = mapper.mappings.find(x => x.id == e.target.dataset.mid);
    if (!m) return;
    m.audioParam = e.target.value;
    const p = engine.PARAMS[m.audioParam];
    if (p) { m.outMin = p.min; m.outMax = p.max; }
    renderMapper();
  }));

  rows.querySelectorAll('.m-sig').forEach(el => el.addEventListener('change', e => {
    const m = mapper.mappings.find(x => x.id == e.target.dataset.mid);
    if (m) m.signal = e.target.value;
  }));

  rows.querySelectorAll('.m-min').forEach(el => el.addEventListener('change', e => {
    const m = mapper.mappings.find(x => x.id == e.target.dataset.mid);
    if (m) m.outMin = parseFloat(e.target.value);
  }));

  rows.querySelectorAll('.m-max').forEach(el => el.addEventListener('change', e => {
    const m = mapper.mappings.find(x => x.id == e.target.dataset.mid);
    if (m) m.outMax = parseFloat(e.target.value);
  }));

  rows.querySelectorAll('.m-curve').forEach(el => el.addEventListener('change', e => {
    const m = mapper.mappings.find(x => x.id == e.target.dataset.mid);
    if (m) m.curve = e.target.value;
  }));

  rows.querySelectorAll('.rm-btn').forEach(el => el.addEventListener('click', e => {
    mapper.remove(parseInt(e.target.dataset.mid));
    renderMapper();
  }));
}

function updateMapperBars() {
  mapper.mappings.forEach(m => {
    const el = document.getElementById(`mb-${m.id}`);
    if (!el || !m.signal) return;
    const p = engine.PARAMS[m.audioParam];
    const val = engine.PARAMS[m.audioParam]?.val ?? 0;
    const norm = p ? (val - p.min) / (p.max - p.min) : 0;
    el.style.width = Math.max(0, Math.min(100, norm * 100)).toFixed(1) + '%';
  });
}

// ── Audio controls UI ─────────────────────────────────────────────────
function renderAudioPanel() {
  const panel = document.getElementById('audio-panel');

  const rangeRow = (key, p) => `
    <div class="ctrl-row">
      <span class="ctrl-lbl">${p.label}</span>
      <input type="range" class="apr" data-key="${key}"
        min="${p.min}" max="${p.max}" value="${p.val}"
        step="${((p.max - p.min) / 300).toPrecision(3)}">
      <span class="ctrl-val" id="av-${key}">${p.val.toFixed(p.unit==='Hz'?0:2)}</span>
    </div>`;

  const waveBtn = (type, label, id) =>
    `<div class="wave-btn" data-type="${type}" data-osc="${id}">${label}</div>`;

  panel.innerHTML = `
    <div class="audio-section">
      <div class="audio-section-label">Osc 1 Waveform</div>
      <div class="wave-btns" id="osc1-waves">
        ${waveBtn('sine','SIN','1')}${waveBtn('triangle','TRI','1')}
        ${waveBtn('sawtooth','SAW','1')}${waveBtn('square','SQR','1')}
      </div>
    </div>
    <div class="audio-section">
      <div class="audio-section-label">Osc 2 Waveform</div>
      <div class="wave-btns" id="osc2-waves">
        ${waveBtn('sine','SIN','2')}${waveBtn('triangle','TRI','2')}
        ${waveBtn('sawtooth','SAW','2')}${waveBtn('square','SQR','2')}
      </div>
    </div>
    <div class="audio-section">
      <div class="audio-section-label">Filter Type</div>
      <div class="wave-btns" id="filt-types">
        ${['lowpass','highpass','bandpass','notch'].map(t =>
          `<div class="wave-btn" data-ftype="${t}">${t.slice(0,3).toUpperCase()}</div>`
        ).join('')}
      </div>
    </div>
    <div class="audio-section" style="border-bottom:none;">
      ${Object.entries(engine.PARAMS).map(([k,p]) => rangeRow(k,p)).join('')}
    </div>
  `;

  // Wave type buttons
  const activateWave = (group, type) => {
    group.querySelectorAll('.wave-btn').forEach(b => b.classList.toggle('on', b.dataset.type===type));
  };
  document.getElementById('osc1-waves').querySelectorAll('.wave-btn').forEach(b => {
    b.addEventListener('click', () => {
      engine.setOsc1Type(b.dataset.type);
      activateWave(b.parentElement, b.dataset.type);
    });
  });
  document.getElementById('osc2-waves').querySelectorAll('.wave-btn').forEach(b => {
    b.addEventListener('click', () => {
      engine.setOsc2Type(b.dataset.type);
      activateWave(b.parentElement, b.dataset.type);
    });
  });
  document.getElementById('filt-types').querySelectorAll('.wave-btn').forEach(b => {
    b.addEventListener('click', () => {
      engine.setFilterType(b.dataset.ftype);
      activateWave(b.parentElement, b.dataset.ftype);
    });
  });

  // Range sliders
  panel.querySelectorAll('.apr').forEach(el => {
    el.addEventListener('input', e => {
      const key = e.target.dataset.key;
      const val = parseFloat(e.target.value);
      engine.set(key, val);
      const p = engine.PARAMS[key];
      const dispEl = document.getElementById(`av-${key}`);
      if (dispEl) dispEl.textContent = val.toFixed(p.unit==='Hz'?0:2);
    });
  });

  // Mark defaults
  document.getElementById('osc1-waves').querySelector('[data-type="sine"]').classList.add('on');
  document.getElementById('osc2-waves').querySelector('[data-type="triangle"]').classList.add('on');
  document.getElementById('filt-types').querySelector('[data-ftype="lowpass"]').classList.add('on');
}

function updateAudioSliders() {
  // Keep sliders in sync with mapper-driven values
  mapper.mappings.forEach(m => {
    if (!m.signal) return;
    const p = engine.PARAMS[m.audioParam];
    if (!p) return;
    const slider = document.querySelector(`.apr[data-key="${m.audioParam}"]`);
    const valEl  = document.getElementById(`av-${m.audioParam}`);
    if (slider) slider.value = p.val;
    if (valEl)  valEl.textContent = p.val.toFixed(p.unit==='Hz'?0:2);
  });
}

// ── Waveform visualizer ───────────────────────────────────────────────
const vizCanvas = document.getElementById('viz-canvas');
const vizCtx = vizCanvas.getContext('2d');

function drawViz() {
  const W = vizCanvas.offsetWidth, H = 72;
  if (vizCanvas.width !== W) vizCanvas.width = W;
  vizCanvas.height = H;

  vizCtx.fillStyle = '#020204';
  vizCtx.fillRect(0, 0, W, H);

  const wave = engine.getWaveform();
  if (!wave) {
    vizCtx.strokeStyle = '#1c1c2e';
    vizCtx.lineWidth = 1;
    vizCtx.beginPath();
    vizCtx.moveTo(0, H/2); vizCtx.lineTo(W, H/2);
    vizCtx.stroke();
    return;
  }

  // Draw waveform in cyan
  vizCtx.strokeStyle = '#00e5cc';
  vizCtx.lineWidth = 1.5;
  vizCtx.shadowColor = '#00e5cc';
  vizCtx.shadowBlur = 6;
  vizCtx.beginPath();
  const step = W / wave.length;
  for (let i = 0; i < wave.length; i++) {
    const x = i * step;
    const y = (0.5 + wave[i] * 0.45) * H;
    i === 0 ? vizCtx.moveTo(x, y) : vizCtx.lineTo(x, y);
  }
  vizCtx.stroke();
  vizCtx.shadowBlur = 0;

  // Amplitude fill (subtle)
  vizCtx.fillStyle = '#00e5cc0a';
  vizCtx.lineTo(W, H/2); vizCtx.lineTo(0, H/2); vizCtx.fill();
}

// ═══════════════════════════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════════════════════════
function loop() {
  mapper.tick();
  updateSigPanel();
  updateMapperBars();
  if (engine.started) updateAudioSliders();
  drawViz();
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════════════════════
//  EVENT HANDLERS
// ═══════════════════════════════════════════════════════════════════════
document.getElementById('cv-btn').addEventListener('click', async () => {
  const btn = document.getElementById('cv-btn');
  if (cvSource.running) {
    cvSource.running = false;
    setStatus('', 'STOPPED');
    btn.textContent = 'START CAMERA';
    btn.classList.remove('on');
    return;
  }
  btn.disabled = true;
  btn.textContent = 'LOADING…';
  try {
    await cvSource.init();
    await cvSource.startCamera();
    setStatus('active', 'CV ACTIVE');
    btn.textContent = 'STOP CAMERA';
    btn.disabled = false;
    btn.classList.add('on');

    buildSigPanel();
    renderMapper(); // refresh dropdowns with signal list
  } catch (err) {
    setStatus('error', 'ERROR: ' + err.message.slice(0, 30));
    btn.textContent = 'RETRY';
    btn.disabled = false;
    console.error(err);
  }
});

document.getElementById('audio-btn').addEventListener('click', async () => {
  const btn = document.getElementById('audio-btn');
  if (engine.started) {
    engine.stop();
    btn.textContent = 'AUDIO OFF';
    btn.classList.remove('on');
    document.getElementById('audio-panel').innerHTML = `
      <div style="padding:16px 10px;color:var(--border2);font-size:10px;text-align:center;">
        Enable audio to begin
      </div>`;
  } else {
    await engine.start();
    btn.textContent = 'AUDIO ON';
    btn.classList.add('on');
    renderAudioPanel();
  }
});

document.getElementById('add-map-btn').addEventListener('click', () => {
  const firstParam = Object.keys(engine.PARAMS)[0];
  mapper.add(firstParam);
  renderMapper();
});

document.getElementById('preset-btn').addEventListener('click', () => {
  mapper.applyPreset();
  renderMapper();
  toast('Preset loaded — start camera + audio to play!');
});

// ── Init ──────────────────────────────────────────────────────────────
renderMapper(); // empty state
loop();
</script>
