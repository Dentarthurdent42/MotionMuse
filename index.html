<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MotionMuse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00e5cc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MotionMuse">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="app">
  <!-- ── Header ──────────────────────────────────────────── -->
  <header id="header">
    <div class="logo">MOTION<span>MUSE</span></div>
    <div class="hstatus">
      <div class="dot" id="cv-dot"></div>
      <span id="status-lbl">READY</span>
    </div>
    <div class="hsep"></div>
    <button class="btn" id="cv-btn">START CAMERA</button>
    <button class="btn purple" id="audio-btn">AUDIO OFF</button>
    <button class="btn" id="dev-btn" aria-pressed="false"
            title="Developer mode — reveals experimental, under-construction features">DEV</button>
    <button class="btn" id="donate-btn" aria-haspopup="menu" aria-expanded="false"
            title="Support this project — donation links">♥</button>
  </header>

  <!-- ── Main ───────────────────────────────────────────── -->
  <div id="main">

    <!-- LEFT: Input source + Signals -->
    <div class="panel panel-src">
      <div class="src-tabs">
        <div class="src-tab active">CV</div>
        <div class="src-tab future uc-feature" data-soon="EEG input — under construction">EEG<span class="src-tab-wip">🚧</span></div>
        <div class="src-tab future uc-feature" data-soon="EMG input — under construction">EMG<span class="src-tab-wip">🚧</span></div>
      </div>

      <div id="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <canvas id="face-overlay"></canvas>
        <div class="cam-toggles">
          <button id="depth-btn" class="depth-toggle uc-feature"
                  title="Under construction — use an optical depth sensor (WebXR LiDAR / ToF) for true metric depth (DEV mode feature)"><span id="depth-btn-lbl">◈ LiDAR</span><span class="src-tab-wip">🚧</span></button>
          <button id="face-btn" class="depth-toggle" disabled
                  title="Track facial landmarks: eyebrows, lips, tongue, cheeks, ears (start the camera first)">☺ FACE</button>
          <button id="gaze-btn" class="depth-toggle" disabled
                  title="Track pupil orientation as gaze_x / gaze_y signals (start the camera first)">◉ GAZE</button>
          <button id="fs-btn" class="depth-toggle"
                  title="Fullscreen camera view">⛶ FULL</button>
          <button id="fskbd-btn" class="depth-toggle fs-only"
                  title="Show the piano keyboard overlay">🎹 KEYS</button>
        </div>
        <div id="latency-bar">
          <span>FPS <b id="lat-fps">—</b></span>
          <span>HAND <b id="lat-hand">—</b></span>
          <span>POSE <b id="lat-pose">—</b></span>
          <span>TOTAL <b id="lat-total">—</b></span>
          <span class="uc-feature">MODEL <b id="lat-model">—</b></span>
          <span id="lat-depth-wrap" style="display:none">DEPTH <b id="lat-depth">—</b></span>
        </div>
        <div id="cam-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>
          </svg>
          <span>START CAMERA</span>
        </div>
        <canvas id="fs-kbd"></canvas>
      </div>

      <div class="panel uc-feature" id="model-panel" style="border-top:1px solid var(--border);">
        <div class="ph">MODELS <span class="uc-badge">dev</span></div>
        <div class="pb" id="model-body">
          <label class="model-row">POSE
            <select id="model-pose" aria-label="Pose estimation model"></select>
          </label>
          <label class="model-row">DELEGATE
            <select id="model-delegate" aria-label="Inference delegate (MediaPipe models)">
              <option>GPU</option><option>CPU</option>
            </select>
          </label>
          <div id="model-stats">start camera for live stats</div>
        </div>
      </div>

      <div class="panel" style="border-top:1px solid var(--border);">
        <div class="ph">
          SIGNALS
          <span style="margin-left:auto;font-size:8px;color:var(--dim);">CLICK TO COPY KEY</span>
        </div>
        <div class="pb" id="sig-list">
          <div style="padding:20px 10px;color:var(--dim);font-size:10px;text-align:center;">
            Start camera to see signals
          </div>
        </div>
      </div>
    </div>

    <div class="splitter" id="split-l" title="Drag to resize — double-click to reset"></div>

    <!-- MIDDLE: Mapper -->
    <div class="panel panel-map">
      <div class="ph">PATCHBAY · INPUTS → OUTPUTS</div>
      <div class="mapper-toolbar">
        <span class="mapper-hint" style="flex:1">Drag a socket ● → ● to wire an input to an output</span>
        <button class="btn" id="preset-btn">PRESET</button>
        <button class="btn" id="save-btn" title="Download all mappings, audio settings and tuning as a file">SAVE</button>
        <button class="btn" id="load-btn" title="Load mappings and settings from a saved file">LOAD</button>
        <input type="file" id="load-file" accept="application/json,.json" hidden>
      </div>
      <div id="mapper-rows"></div>
    </div>

    <div class="splitter" id="split-r" title="Drag to resize — double-click to reset"></div>

    <!-- RIGHT: Audio engine -->
    <div class="panel">
      <div class="ph">AUDIO ENGINE</div>
      <canvas id="viz-canvas"></canvas>
      <div class="pb" id="audio-panel">
        <div style="padding:16px 10px;color:var(--dim);font-size:10px;text-align:center;">
          Enable audio to begin
        </div>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script type="module" src="src/main.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
</html>
