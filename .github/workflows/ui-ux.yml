name: UI/UX Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui-ux:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Contrast check
        run: npm run test:contrast

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The guided tour is data pointing at live UI — this fails the build if
      # a UI change orphans a tutorial step (see src/ui/tutorial.js header).
      - name: Tutorial staleness guard
        run: npm run test:tutorial

      # Proves a redeploy is visible on the next load. Regression guard for the
      # service worker serving stale builds to returning visitors.
      - name: Service-worker freshness
        run: npm run test:sw

      # The engine starts with the page, muted. Forces the suspended
      # AudioContext that real browsers hand you and headless Chromium does
      # not, because that difference already hid one shipped bug.
      - name: Audio launch (muted, suspended context)
        run: npm run test:launch

      - name: Run UI/UX tests
        run: npm run test:ui
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-ux-report
          path: test-results/ui-ux-report.html
          retention-days: 30
